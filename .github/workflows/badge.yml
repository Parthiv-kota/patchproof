name: Self badge

# Dogfood: this repository publishes its own live badge from its own checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: self-badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: python -m pip install --quiet --disable-pip-version-check .
      - name: Publish the badge
        uses: ./badge
        with:
          command: python -m unittest discover -s tests
          branch: patchproof-badges
          path: tests.svg
          label: tests
